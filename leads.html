<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Leads — Nadir Studios</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body{ padding:40px 20px 80px; }
  .leads-wrap{ max-width:1100px; margin:0 auto; }
  .leads-card{
    background:var(--bg-alt); border:1px solid var(--border); border-radius:14px;
    padding:32px; margin-bottom:24px;
  }
  .leads-card h1{ font-size:1.4rem; margin-bottom:4px; }
  .leads-card p.sub{ color:var(--text-dim); font-size:.92rem; margin-bottom:24px; }
  .field-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type="email"], input[type="text"]{
    background:var(--bg); border:1px solid var(--border-strong); color:var(--text);
    padding:11px 14px; border-radius:8px; font-size:.95rem; min-width:240px;
  }
  button{
    font-family:var(--font-head); font-weight:600; font-size:.9rem;
    padding:11px 20px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(120deg,var(--violet),var(--cyan)); color:#05070d;
  }
  button.ghost{ background:transparent; border:1px solid var(--border-strong); color:var(--text); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .msg{ margin-top:14px; font-size:.88rem; }
  .msg.err{ color:var(--coral); }
  .msg.ok{ color:var(--cyan); }
  table{ width:100%; border-collapse:collapse; font-size:.87rem; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  th{ color:var(--text-dim); font-weight:600; text-transform:uppercase; font-size:.72rem; letter-spacing:.04em; }
  tr:hover td{ background:rgba(255,255,255,0.02); }
  .pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:600; }
  .pill-hot{ background:rgba(255,91,106,.15); color:var(--coral); }
  .pill-good{ background:rgba(56,240,216,.15); color:var(--cyan); }
  .pill-potential, .pill-low{ background:rgba(255,255,255,.08); color:var(--text-dim); }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .status-tag{ font-size:.72rem; color:var(--text-dim); }
  .result-row{ font-size:.82rem; padding:4px 0; }
  .result-sent{ color:var(--cyan); }
  .result-failed{ color:var(--coral); }
  .result-skipped{ color:var(--text-faint); }
  #app-section{ display:none; }
  table-wrap{ overflow-x:auto; }
  .table-wrap{ overflow-x:auto; }
</style>
</head>
<body>
<div class="leads-wrap">

  <div class="leads-card" id="login-section">
    <h1>Leads — sign in</h1>
    <p class="sub">Enter the admin email to receive a magic sign-in link. Only the Nadir Studios admin account can view or send to leads.</p>
    <div class="field-row">
      <input type="email" id="login-email" placeholder="you@nadirstudios.co.uk" autocomplete="email">
      <button id="send-link-btn">Send sign-in link</button>
    </div>
    <p class="msg" id="login-msg"></p>
  </div>

  <div id="app-section">
    <div class="leads-card">
      <div class="toolbar">
        <div>
          <h1 style="margin-bottom:2px;">Leads</h1>
          <p class="sub" style="margin-bottom:0;">Signed in as <strong id="who"></strong></p>
        </div>
        <div class="field-row">
          <button class="ghost" id="refresh-btn">Refresh</button>
          <button class="ghost" id="signout-btn">Sign out</button>
        </div>
      </div>

      <div class="field-row" style="margin-bottom:16px;">
        <label style="font-size:.85rem;color:var(--text-dim);display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="select-all"> Select all with an email
        </label>
        <span class="status-tag" id="selected-count">0 selected</span>
        <button id="send-email-btn" style="margin-left:auto;">Send tailored email to selected</button>
      </div>

      <p class="msg" id="send-msg"></p>
      <div id="results"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Business</th>
              <th>Category</th>
              <th>Email</th>
              <th>Priority</th>
              <th>Contact status</th>
              <th>Last contacted</th>
            </tr>
          </thead>
          <tbody id="leads-body">
            <tr><td colspan="7" style="color:var(--text-dim);">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="assets/js/vendor/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://bwesxklxpgegsfkdxfyg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3ZXN4a2x4cGdlZ3Nma2R4ZnlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NzcxNDMsImV4cCI6MjEwMzU1MzE0M30.rRSHfVFXvCAHeNdjZlcHfq5Aoyn-j_M3SJJRQV-Ezu8";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginSection = document.getElementById("login-section");
  const appSection = document.getElementById("app-section");
  const loginMsg = document.getElementById("login-msg");
  const sendMsg = document.getElementById("send-msg");
  const resultsEl = document.getElementById("results");
  const leadsBody = document.getElementById("leads-body");
  const whoEl = document.getElementById("who");
  const selectAll = document.getElementById("select-all");
  const selectedCount = document.getElementById("selected-count");

  let currentLeads = [];

  function setLoginMsg(text, isError) {
    loginMsg.textContent = text;
    loginMsg.className = "msg " + (isError ? "err" : "ok");
  }

  document.getElementById("send-link-btn").addEventListener("click", async function () {
    const email = document.getElementById("login-email").value.trim();
    if (!email) { setLoginMsg("Enter an email address.", true); return; }
    setLoginMsg("Sending…", false);
    const { error } = await sb.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.href.split("#")[0] }
    });
    if (error) { setLoginMsg(error.message, true); return; }
    setLoginMsg("Check your inbox for a sign-in link.", false);
  });

  document.getElementById("signout-btn").addEventListener("click", async function () {
    await sb.auth.signOut();
    window.location.reload();
  });

  document.getElementById("refresh-btn").addEventListener("click", loadLeads);

  selectAll.addEventListener("change", function () {
    document.querySelectorAll(".lead-check").forEach(function (cb) {
      if (!cb.disabled) cb.checked = selectAll.checked;
    });
    updateSelectedCount();
  });

  document.getElementById("send-email-btn").addEventListener("click", sendToSelected);

  function updateSelectedCount() {
    const n = document.querySelectorAll(".lead-check:checked").length;
    selectedCount.textContent = n + " selected";
  }

  function priorityPillClass(p) {
    if (p === "HOT") return "pill-hot";
    if (p === "GOOD") return "pill-good";
    return "pill-potential";
  }

  function renderLeads(leads) {
    currentLeads = leads;
    if (!leads.length) {
      leadsBody.innerHTML = '<tr><td colspan="7" style="color:var(--text-dim);">No leads found.</td></tr>';
      return;
    }
    leadsBody.innerHTML = leads.map(function (lead) {
      const hasEmail = !!lead.email;
      return '<tr>' +
        '<td><input type="checkbox" class="lead-check" data-id="' + lead.id + '" ' + (hasEmail ? '' : 'disabled') + '></td>' +
        '<td>' + escapeHtml(lead.business_name || "") + '</td>' +
        '<td>' + escapeHtml(lead.category || "—") + '</td>' +
        '<td>' + (hasEmail ? escapeHtml(lead.email) : '<span style="color:var(--text-faint);">none</span>') + '</td>' +
        '<td>' + (lead.priority ? '<span class="pill ' + priorityPillClass(lead.priority) + '">' + lead.priority + '</span>' : '—') + '</td>' +
        '<td>' + escapeHtml(lead.contact_status || "NOT_CONTACTED") + '</td>' +
        '<td>' + escapeHtml(lead.last_contacted || "—") + '</td>' +
        '</tr>';
    }).join("");

    document.querySelectorAll(".lead-check").forEach(function (cb) {
      cb.addEventListener("change", updateSelectedCount);
    });
    updateSelectedCount();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  async function loadLeads() {
    leadsBody.innerHTML = '<tr><td colspan="7" style="color:var(--text-dim);">Loading…</td></tr>';
    const { data, error } = await sb.from("leads").select("*").order("created_at", { ascending: false });
    if (error) {
      leadsBody.innerHTML = '<tr><td colspan="7" style="color:var(--coral);">' + escapeHtml(error.message) + '</td></tr>';
      return;
    }
    renderLeads(data || []);
  }

  async function sendToSelected() {
    const ids = Array.from(document.querySelectorAll(".lead-check:checked")).map(function (cb) { return cb.dataset.id; });
    if (!ids.length) { sendMsg.textContent = "Select at least one lead with an email address."; sendMsg.className = "msg err"; return; }

    const btn = document.getElementById("send-email-btn");
    btn.disabled = true;
    sendMsg.textContent = "Sending " + ids.length + " email(s)…";
    sendMsg.className = "msg ok";
    resultsEl.innerHTML = "";

    const { data, error } = await sb.functions.invoke("send-lead-email", { body: { leadIds: ids } });

    btn.disabled = false;

    if (error) {
      sendMsg.textContent = "Failed to send: " + error.message;
      sendMsg.className = "msg err";
      return;
    }

    sendMsg.textContent = "Done.";
    resultsEl.innerHTML = (data.results || []).map(function (r) {
      const cls = r.status === "sent" ? "result-sent" : (r.status === "failed" ? "result-failed" : "result-skipped");
      return '<div class="result-row ' + cls + '">' + escapeHtml(r.business_name) + ' — ' + r.status + (r.reason ? ": " + escapeHtml(r.reason) : "") + '</div>';
    }).join("");

    loadLeads();
  }

  async function checkSession() {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      loginSection.style.display = "none";
      appSection.style.display = "block";
      whoEl.textContent = data.session.user.email;
      loadLeads();
    } else {
      loginSection.style.display = "block";
      appSection.style.display = "none";
    }
  }

  sb.auth.onAuthStateChange(function () { checkSession(); });
  checkSession();
})();
</script>
</body>
</html>
